name: Daily Belgium Energy Price Forecast Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2:00 AM UTC
  workflow_dispatch:      # Manuel trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Step 1 - Fetch Actual Data from ENTSO-E
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_data.py

      - name: Step 2 - Run dbt Transformations & Feature Engineering
        run: |
          cd belgium_energy_dbt
          dbt deps
          dbt run

      - name: Step 3 - Predict Future Prices & Upload to BigQuery
        run: python predict_future.py