name: Daily Belgium Energy Price Forecast Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 2:00 AM UTC (TSİ 05:00)
  workflow_dispatch:      # Manual trigger button

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Step 1 - Fetch Actual Data from ENTSO-E
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python fetch_data.py

      - name: Setup dbt profiles.yml
        run: |
          mkdir -p ~/.dbt
          cat <<'EOF' > ~/.dbt/profiles.yml
          belgium_energy_dbt:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: service-account-json
                project: belgium-energy-data-123
                dataset: dbt_belgium_energy
                keyfile_json: ${{ secrets.GCP_SA_KEY }}
                threads: 4
                timeout_seconds: 300
                priority: interactive
          EOF

      - name: Step 2 - Run dbt Transformations & Feature Engineering
        run: |
          cd belgium_energy_dbt
          dbt deps
          dbt run --exclude fact_forecast_performance --profiles-dir ~/.dbt

      - name: Step 3 - Predict Future Prices & Upload to BigQuery
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: python predict_future.py

      - name: Step 4 - Update Dashboard Performance Model
        run: |
          cd belgium_energy_dbt
          dbt run --select fact_forecast_performance --profiles-dir ~/.dbt

      - name: Send Slack Notification (Success)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"✅ *Successful:* Belgium Energy Pipeline ran successfully. New data has been uploaded to Looker Studio!"}' ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification (Failure)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"🚨 *Failure:* An issue occurred while running the Belgium Energy Pipeline! Please check the GitHub Actions logs."}' ${{ secrets.SLACK_WEBHOOK_URL }}